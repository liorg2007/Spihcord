name: shpihcord

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8420"
      DATA_DIR: /data
      TRUST_PROXY: "true"
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-43200}
      STUN_URLS: ${STUN_URLS:-stun:${DOMAIN}:3478,stun:stun.l.google.com:19302}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - hub_data:/data
    expose:
      - "8420"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [hub]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking: TURN needs the real public IP and a wide UDP port range.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${DOMAIN:?set DOMAIN in .env}

volumes:
  hub_data:
  caddy_data:
  caddy_config:
