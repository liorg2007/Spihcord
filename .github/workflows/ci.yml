name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI never writes to the repo, releases or packages.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment
      # names the release. Update both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.x
          cache: npm

      # No dependency install scripts run; the few native pieces we need are
      # set up explicitly below (supply-chain hardening, security S1/S2).
      - run: npm ci --ignore-scripts

      - name: Native modules
        shell: bash
        run: |
          # Hub: compile better-sqlite3 from source instead of downloading an
          # unhashed prebuilt binary.
          if [ -d node_modules/better-sqlite3 ]; then npm rebuild better-sqlite3 --build-from-source; fi
          # Electron binary (checksum-verified by @electron/get) for the e2e run.
          node node_modules/electron/install.js
          # uiohook-napi and koffi ship N-API prebuilds in the package: nothing to run.

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: npm audit (critical/high)
        run: npm audit --audit-level=high

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        # Hidden Electron windows + fake media devices; not yet proven on Linux CI.
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64 libnss3 libxss1 libxtst6
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e
