name: Release

# Push a tag like v0.2.0 -> installers for Windows/macOS/Linux are built and
# uploaded to a *draft* GitHub Release, the update manifests (latest*.yml) are
# signed with the Ed25519 update key, and the hub image is pushed to GHCR.
# Review the draft on GitHub and click "Publish release"; only then do
# existing installs see it (electron-updater ignores drafts, and the app
# refuses any update whose manifest signature doesn't verify).
#
# The desktop job runs in the protected `release` environment, which holds
# UPDATE_SIGNING_KEY and the signing certificates; configure it as described
# in README.md ("Releasing") with required reviewers and a v* tag rule.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write # create the draft release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
            prebuilds: ""
          - os: macos-latest
            builder_args: --mac
            # macos-latest is arm64; the x64 app needs koffi's darwin-x64 binary too.
            prebuilds: darwin-x64 darwin-arm64
          - os: ubuntu-latest
            builder_args: --linux
            prebuilds: linux-x64 linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.x
          # No dependency cache for release builds (cache poisoning).

      # No install scripts: electron-builder fetches its own (checksummed)
      # Electron, and uiohook-napi / koffi ship prebuilt N-API binaries.
      - run: npm ci --ignore-scripts

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w @shpihcord/desktop

      - name: Fetch native prebuilds for cross-arch builds
        if: matrix.prebuilds != ''
        run: node apps/desktop/scripts/fetch-native-prebuilds.mjs ${{ matrix.prebuilds }}

      - name: Build and publish (draft)
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization: all optional. Without them the
          # macOS build is ad-hoc signed and not notarized (users must
          # right-click > Open), and auto-update falls back to a link.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional): a .pfx as base64.
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # Empty secrets must be unset, or electron-builder tries to use them.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          if [ -z "${CSC_LINK:-}" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-vite build
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then PUBLISH=always; else PUBLISH=never; fi
          npx electron-builder ${{ matrix.builder_args }} --publish "$PUBLISH"

      - name: Smoke test (packaged app loads its native modules)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exe=$(ls apps/desktop/release/*/win-unpacked/Shpihcord.exe | head -1)
          "$exe" --self-test | tee self-test.txt
          grep -q '"ok":true' self-test.txt

      - name: Sign update manifests
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          manifests=(apps/desktop/release/*/latest*.yml)
          if [ ${#manifests[@]} -eq 0 ]; then echo "no update manifests produced"; exit 1; fi
          node apps/desktop/scripts/sign-update-manifests.mjs "${manifests[@]}"
          node apps/desktop/scripts/sign-update-manifests.mjs --verify "${manifests[@]}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            for m in "${manifests[@]}"; do
              gh release upload "$GITHUB_REF_NAME" "$m.sig" --clobber --repo "$GITHUB_REPOSITORY"
            done
          fi

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*/*.exe
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*.deb
            apps/desktop/release/*/latest*.yml
            apps/desktop/release/*/latest*.yml.sig
          if-no-files-found: ignore

  hub-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/liorg2007/shpihcord-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
