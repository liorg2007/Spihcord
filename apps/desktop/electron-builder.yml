appId: app.shpihcord.desktop
productName: Shpihcord
copyright: Copyright © 2026 Shpihcord
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.map"
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
  - "**/node_modules/koffi/**"
# uiohook-napi and koffi ship N-API prebuilds (ABI-stable), no rebuild against Electron needed.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Shpihcord
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Network
  artifactName: ${productName}-${version}.${ext}
mac:
  target: dmg
  category: public.app-category.social-networking
  extendInfo:
    NSMicrophoneUsageDescription: Shpihcord needs the microphone for voice chat.
    NSCameraUsageDescription: Shpihcord uses the camera when you turn on video in a voice channel.
    NSAudioCaptureUsageDescription: Shpihcord captures system audio when you share your screen.
